name: Release

# Two addons, two CurseForge projects (the user, 2026-10-03: the pictures a download of their own):
# - v<version>: the viewer, AzerothGPS_StreetView (`sv.cmd release --publish`). Checks the toc's version, takes
#   the CHANGELOG.md section as the notes, uploads the release's zip to packs.json viewer.curseforge_project
#   (requiring AzerothGPS).
# - data-v<YYYY.MM.DD>: the pictures, AzerothGPS_StreetView_Data (`sv.cmd release-data --publish`: built on a
#   PC, never in git). Uploads the release's zip to packs.json data.curseforge_project (requiring the viewer),
#   with the release's notes.
# "Run workflow" by hand does a dry run: it only checks the CurseForge game version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only look up the CurseForge game version (no upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: CurseForge game version (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION_ID: ${{ vars.CF_GAME_VERSION_ID }}
        run: python3 tools/svtools/curseforge.py --dry-run

      - name: Which addon, version and notes
        if: github.event_name == 'release'
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${TAG#data-v}" != "$TAG" ]; then
            VERSION="${TAG#data-v}"
            KEY=data
            NAME=AzerothGPS_StreetView_Data
            gh release view "$TAG" --json body --jq .body > notes.md
          else
            VERSION="${TAG#v}"
            KEY=viewer
            NAME=AzerothGPS_StreetView
            TOC=$(grep -m1 '^## Version:' addon/AzerothGPS_StreetView/AzerothGPS_StreetView.toc | sed 's/## Version: *//' | tr -d '\r')
            if [ "$TOC" != "$VERSION" ]; then echo "tag $VERSION but the toc says $TOC"; exit 1; fi
            awk -v v="$VERSION" '
              /^## / { on = ($2 == v) ; next }
              on { print }
            ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          fi
          if [ ! -s notes.md ]; then echo "no release notes for $TAG"; exit 1; fi
          read -r PROJECT TITLE REQUIRES < <(python3 -c "
          import json; c = json.load(open('packs.json'))['$KEY']
          print(c.get('curseforge_project') or '', (c.get('title') or 'AzerothGPS StreetView').replace(' ', '_'), ','.join(c.get('curseforge_requires') or []))")
          if [ -z "$PROJECT" ]; then echo "no $KEY.curseforge_project in packs.json"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE//_/ }" >> "$GITHUB_OUTPUT"
          echo "requires=$REQUIRES" >> "$GITHUB_OUTPUT"

      - name: The release's zip
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}.zip"
          gh release download "${{ github.event.release.tag_name }}" --pattern "$ZIP" --dir dist
          ls -la dist
          unzip -l "dist/$ZIP" | grep -q "${{ steps.v.outputs.name }}/${{ steps.v.outputs.name }}.toc" || { echo "not the addon's zip"; exit 1; }
          if [ "${{ steps.v.outputs.name }}" = "AzerothGPS_StreetView_Data" ]; then
            unzip -l "dist/$ZIP" | grep -q "AzerothGPS_StreetView_Data/Images/" || { echo "the zip has no pictures"; exit 1; }
          elif unzip -l "dist/$ZIP" | grep -q "/Images/"; then
            echo "pictures in the viewer's zip (they ship in AzerothGPS_StreetView_Data)"; exit 1
          fi

      - name: Upload to CurseForge
        if: github.event_name == 'release'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION_ID: ${{ vars.CF_GAME_VERSION_ID }}
        run: |
          python3 tools/svtools/curseforge.py --project "${{ steps.v.outputs.project }}" \
            --zip "dist/${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}.zip" \
            --display "${{ steps.v.outputs.title }} ${{ steps.v.outputs.version }}" \
            --changelog notes.md --requires "${{ steps.v.outputs.requires }}"
